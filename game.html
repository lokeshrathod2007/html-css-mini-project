<!DOCTYPE html>
<html>
<head>
<title>Lights Out | Retro Game</title>

<style>

/* RETRO FONT */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

/* BODY */
body
{
    font-family: 'Press Start 2P', cursive;
    background: black;
    color: #00ffcc;
    text-align: center;
}

/* NAVBAR */
.navbar
{
    background: #000;
    padding: 15px;
    border-bottom: 3px solid #ff00ff;
}

.navbar a
{
    color: #00ffcc;
    margin: 0 20px;
    text-decoration: none;
}

.navbar a:hover
{
    color: #ffff00;
}

/* TITLE */
h1
{
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff;
}

/* TIMER */
#timer
{
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
}

/* GRID */
.grid
{
    display: grid;
    grid-template-columns: repeat(5, 70px);
    gap: 10px;
    justify-content: center;
    margin-top: 30px;
}

/* LIGHT OFF */
.light
{
    width: 70px;
    height: 70px;
    background: #111;
    border: 2px solid #00ffcc;
    cursor: pointer;
    box-shadow: inset 0 0 10px #00ffcc;
}

/* LIGHT ON */
.light.on
{
    background: yellow;
    box-shadow:
        0 0 10px yellow,
        0 0 20px yellow,
        0 0 40px yellow;
}

/* BUTTON */
button
{
    margin-top: 20px;
    padding: 10px;
    font-family: 'Press Start 2P';
    background: black;
    color: #00ffcc;
    border: 2px solid #00ffcc;
    cursor: pointer;
}

button:hover
{
    background: #00ffcc;
    color: black;
}

/* MESSAGE */
#message
{
    margin-top: 20px;
    height: 30px;
}

/* FOOTER */
.footer
{
    margin-top: 30px;
    border-top: 2px solid #ff00ff;
    padding: 10px;
}

</style>

</head>
<body>

<div class="navbar">
<a href="index.html">HOME</a>
<a href="game.html">PLAY</a>
<a href="instructions.html">INSTRUCTIONS</a>
</div>

<h1>RETRO LIGHTS OUT</h1>

<p>TIME LEFT: <span id="timer">30</span></p>

<div class="grid" id="grid"></div>

<button onclick="resetGame()">REPLAY</button>

<div id="message"></div>

<div class="footer">
TURN OFF ALL LIGHTS BEFORE TIME RUNS OUT
</div>

<script>

/* SETTINGS */
const size = 5;
const total = size * size;
let lights = [];
let timeLeft = 30;
let timer;

/* CREATE GRID */
const grid = document.getElementById("grid");

for(let i=0;i<total;i++)
{
    let div = document.createElement("div");

    div.classList.add("light","on");

    div.onclick = function()
    {
        toggle(i);
    };

    grid.appendChild(div);

    lights.push(div);
}

/* GET NEIGHBORS */
function getNeighbors(index)
{
    let neighbors = [index];

    let row = Math.floor(index / size);
    let col = index % size;

    if(row > 0) neighbors.push(index - size);
    if(row < size-1) neighbors.push(index + size);
    if(col > 0) neighbors.push(index - 1);
    if(col < size-1) neighbors.push(index + 1);

    return neighbors;
}

/* TOGGLE */
function toggle(index)
{
    if(timeLeft <= 0) return;

    let list = getNeighbors(index);

    list.forEach(i =>
    {
        lights[i].classList.toggle("on");
    });

    checkWin();
}

/* CHECK WIN */
function checkWin()
{
    let win = true;

    lights.forEach(light =>
    {
        if(light.classList.contains("on"))
            win = false;
    });

    if(win)
    {
        clearInterval(timer);

        document.getElementById("message").innerHTML =
        "YOU WIN!";
    }
}

/* TIMER */
function startTimer()
{
    timer = setInterval(function()
    {
        timeLeft--;

        document.getElementById("timer").innerHTML = timeLeft;

        if(timeLeft <= 0)
        {
            clearInterval(timer);

            document.getElementById("message").innerHTML =
            "GAME OVER";
        }

    },1000);
}

/* RESET */
function resetGame()
{
    clearInterval(timer);

    lights.forEach(light =>
    {
        light.classList.add("on");
    });

    timeLeft = 30;

    document.getElementById("timer").innerHTML = timeLeft;

    document.getElementById("message").innerHTML = "";

    startTimer();
}

/* START */
startTimer();

</script>

</body>
</html>
